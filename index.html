<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #000;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 56px;
      bottom: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 6px;
      z-index: 90;
      border-right: 1px solid #1a1a1a;
      transition: transform 0.2s ease;
    }

    #sidebar.hidden {
      transform: translateX(-56px);
    }

    .svc-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      opacity: 0.5;
      position: relative;
    }

    .svc-btn:hover {
      transform: scale(1.1);
      opacity: 0.8;
    }

    .svc-btn.active {
      opacity: 1;
      box-shadow: 0 0 12px rgba(255,255,255,0.15);
      transform: scale(1.05);
    }

    .svc-btn.active::before {
      content: '';
      position: absolute;
      left: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      border-radius: 0 3px 3px 0;
      background: currentColor;
    }

    .svc-btn[data-svc="chatgpt"]  { background: #10a37f; }
    .svc-btn[data-svc="claude"]   { background: #d97706; }
    .svc-btn[data-svc="gemini"]   { background: #4285f4; }
    .svc-btn[data-svc="deepseek"] { background: #5b6ee1; }

    .sidebar-spacer { flex: 1; }

    .sidebar-bottom-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #444;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar-bottom-btn:hover { background: #1a1a1a; color: #aaa; }
    .sidebar-bottom-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ── Tooltip ── */
    .svc-btn .tooltip {
      position: absolute;
      left: 54px;
      top: 50%;
      transform: translateY(-50%);
      background: #1a1a1a;
      color: #ddd;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 200;
    }
    .svc-btn:hover .tooltip { opacity: 1; }

    /* ── Shortcuts overlay ── */
    #shortcuts-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 56px;
      right: 0;
      bottom: 0;
      background: #000;
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    #shortcuts-overlay.show {
      display: flex;
    }

    #shortcuts-box {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 12px;
      padding: 28px 36px;
      max-width: 420px;
      width: 100%;
    }

    #shortcuts-box h2 {
      font-size: 15px;
      font-weight: 600;
      color: #999;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }

    .shortcut-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #111;
    }

    .shortcut-row:last-child { border-bottom: none; }

    .shortcut-row span {
      color: #777;
      font-size: 13px;
    }

    .shortcut-row kbd {
      background: #1a1a1a;
      color: #ccc;
      padding: 3px 8px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      border: 1px solid #222;
    }

    .shortcut-close-hint {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: #444;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <button class="svc-btn" data-svc="chatgpt" title="ChatGPT">
      G
      <span class="tooltip">ChatGPT  Ctrl+1</span>
    </button>
    <button class="svc-btn" data-svc="claude" title="Claude">
      C
      <span class="tooltip">Claude  Ctrl+2</span>
    </button>
    <button class="svc-btn" data-svc="gemini" title="Gemini">
      G
      <span class="tooltip">Gemini  Ctrl+3</span>
    </button>
    <button class="svc-btn" data-svc="deepseek" title="DeepSeek">
      D
      <span class="tooltip">DeepSeek  Ctrl+4</span>
    </button>

    <div class="sidebar-spacer"></div>

    <button class="sidebar-bottom-btn" id="btn-devtools" title="DevTools (F12)">
      <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </button>
    <button class="sidebar-bottom-btn" id="btn-shortcuts" title="Keyboard shortcuts">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    </button>
  </div>

  <!-- Shortcuts overlay (full panel, replaces the webview area) -->
  <div id="shortcuts-overlay">
    <div id="shortcuts-box">
      <h2>KEYBOARD SHORTCUTS</h2>
      <div class="shortcut-row"><span>ChatGPT</span><kbd>Ctrl+1</kbd></div>
      <div class="shortcut-row"><span>Claude</span><kbd>Ctrl+2</kbd></div>
      <div class="shortcut-row"><span>Gemini</span><kbd>Ctrl+3</kbd></div>
      <div class="shortcut-row"><span>DeepSeek</span><kbd>Ctrl+4</kbd></div>
      <div class="shortcut-row"><span>Toggle sidebar</span><kbd>Ctrl+B</kbd></div>
      <div class="shortcut-row"><span>Reload</span><kbd>Ctrl+R</kbd></div>
      <div class="shortcut-row"><span>DevTools</span><kbd>F12</kbd></div>
      <div class="shortcut-row"><span>Navigate back</span><kbd>Alt+Left</kbd></div>
      <div class="shortcut-row"><span>Navigate forward</span><kbd>Alt+Right</kbd></div>
      <p class="shortcut-close-hint">Press Escape or click the button again to close</p>
    </div>
  </div>

  <script>
    const services = ['chatgpt', 'claude', 'gemini', 'deepseek'];
    const names = { chatgpt: 'ChatGPT', claude: 'Claude', gemini: 'Gemini', deepseek: 'DeepSeek' };
    const btns = document.querySelectorAll('.svc-btn');

    // Service buttons
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        api.switchService(btn.dataset.svc);
      });
    });

    // Bottom buttons
    document.getElementById('btn-devtools').addEventListener('click', () => api.devtools());
    document.getElementById('btn-shortcuts').addEventListener('click', () => api.toggleShortcuts());

    // Listen for service change
    api.onServiceChanged((key) => {
      btns.forEach(b => b.classList.toggle('active', b.dataset.svc === key));
    });

    // Listen for sidebar toggle
    api.onSidebarToggled((visible) => {
      document.getElementById('sidebar').classList.toggle('hidden', !visible);
    });

    // Listen for shortcuts toggle from main process
    api.onShortcutsToggled((visible) => {
      document.getElementById('shortcuts-overlay').classList.toggle('show', visible);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        const idx = parseInt(e.key) - 1;
        if (services[idx]) api.switchService(services[idx]);
      }
      if (e.ctrlKey && e.key === 'b') {
        e.preventDefault();
        api.toggleSidebar();
      }
      if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        api.reload();
      }
      if (e.key === 'F12') {
        e.preventDefault();
        api.devtools();
      }
      if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); api.goBack(); }
      if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); api.goForward(); }
      if (e.key === 'Escape') {
        api.toggleShortcuts();
      }
    });
  </script>

</body>
</html>
